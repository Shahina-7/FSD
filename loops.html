<!DOCTYPE html>
<html>
<head>
<title>Loops Example</title>
<script>

// Using FOR loop
document.write("Using FOR loop:<br>");
for(var i = 1; i <= 10; i++)
{
    document.write(i + "<br>");
}

// Using WHILE loop
document.write("<br>Using WHILE loop:<br>");
var j = 1;
while(j <= 10)
{
    document.write(j + "<br>");
    j++;
}

// Using DO-WHILE loop
document.write("<br>Using DO-WHILE loop:<br>");
var k = 1;
do
{
    document.write(k + "<br>");
    k++;
} while(k <= 10);

</script>
</head>

<body>
</body>
</html>
