<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS Styles</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Selector: h2 | Property: color | Value: maroon */
        h2 {
            color: maroon;
            text-decoration: underline;  /* property: text-decoration | value: underline */
        }

        /* Selector: #box | Property: border | Value: 2px solid black */
        #box {
            border: 2px solid black;
            padding: 10px;   /* property: padding | value: 10px */
            background-color: #ffe4c4;
        }
    </style>
</head>

<body>

    <h1>External Style Example</h1>

    <h2>Internal Style Example</h2>

    <p class="para">
        This paragraph uses an external style sheet.
    </p>

    <!-- Inline CSS -->
    <p style="color: red; font-weight: bold;">
        This paragraph uses inline style.
    </p>

    <div id="box">
        This div uses internal CSS.
    </div>

</body>
</html>
