<!DOCTYPE html>
<html>
<head>
    <title>CSS Color References</title>
    <style>
        /* 1. Color Name */
        .colorName {
            background-color: red;
            color: white;
            padding: 10px;
        }

        /* 2. HEX Value */
        .hexValue {
            background-color: #3498db;
            color: white;
            padding: 10px;
        }

        /* 3. RGB Value */
        .rgbValue {
            background-color: rgb(46, 204, 113);
            color: white;
            padding: 10px;
        }

        /* 4. RGBA Value (with transparency) */
        .rgbaValue {
            background-color: rgba(155, 89, 182, 0.6);
            color: white;
            padding: 10px;
        }

        /* 5. HSL Value */
        .hslValue {
            background-color: hsl(39, 100%, 50%);
            color: white;
            padding: 10px;
        }

        /* 6. HSLA Value (with transparency) */
        .hslaValue {
            background-color: hsla(200, 100%, 50%, 0.5);
            color: black;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>Different Ways to Reference Colors in CSS</h2>

    <div class="colorName">This uses Color Name (red)</div>
    <br>

    <div class="hexValue">This uses HEX Value (#3498db)</div>
    <br>

    <div class="rgbValue">This uses RGB Value (rgb(46, 204, 113))</div>
    <br>

    <div class="rgbaValue">This uses RGBA Value (rgba with transparency)</div>
    <br>

    <div class="hslValue">This uses HSL Value</div>
    <br>

    <div class="hslaValue">This uses HSLA Value (with transparency)</div>

</body>
</html>
