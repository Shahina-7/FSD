<!DOCTYPE html>
<html>
<head>
<title>Find Larger Number</title>
<script>
function findLarger() {
    // Get three numbers from user
    var num1 = parseInt(prompt("Enter first integer:"));
    var num2 = parseInt(prompt("Enter second integer:"));
    var num3 = parseInt(prompt("Enter third integer:"));

    // Check conditions
    if(num1 == num2 && num2 == num3) {
        alert("EQUAL NUMBERS");
    }
    else {
        var largest = num1;

        if(num2 > largest) {
            largest = num2;
        }
        if(num3 > largest) {
            largest = num3;
        }

        alert(largest + " LARGER NUMBER");
    }
}
</script>
</head>

<body onload="findLarger()">
<h2>Check the Information Dialog for Result</h2>
</body>
</html>
